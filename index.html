<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartenpreise</title>
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kartenpreise">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: sticky header, content, iOS-style bottom tab bar, bottom sheet for details */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --fg: #121826; --muted: #5b6475;
  --line: #dde2ea; --accent: #2a5bd7; --accent-fg: #ffffff; --price: #0f7a4a;
  --head: #14213d; --head-fg: #ffffff; --chip: #e7ecf6; --bar: #2a5bd7; --danger: #b42318; --up: #c2410c; --down: #0f7a4a;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --surface: #161c26; --fg: #e8ecf3; --muted: #9aa4b5;
    --line: #273042; --accent: #6d95ff; --accent-fg: #0d1117; --price: #45d08f;
    --head: #0a1530; --head-fg: #ffffff; --chip: #1f2838; --bar: #6d95ff; --danger: #ff8a7a; --up: #ff9a5c; --down: #45d08f; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--head); z-index: 20; }
header {
  position: sticky; top: 0; z-index: 10; background: var(--head); color: var(--head-fg);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 10px;
}
h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
form.search { display: flex; gap: 8px; }
input, select { font: 16px var(--font); }
#set-pick { width: 100%; padding: 9px 12px; border-radius: 10px; border: 0; background: rgba(255,255,255,.14); color: var(--head-fg); font: 15px var(--font); }
#set-pick option { color: #121826; background: #fff; }
input[type=search] { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 0; background: #fff; color: #121826; }
.btn { border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font: 600 15px var(--font); padding: 11px 14px; cursor: pointer; }
.lang { display: flex; gap: 6px; align-items: center; font-size: 13px; opacity: .9; }
.lang button { border: 1px solid rgba(255,255,255,.35); background: transparent; color: var(--head-fg); border-radius: 999px; padding: 3px 10px; font: 600 12px var(--font); }
.lang button[aria-pressed="true"] { background: var(--head-fg); color: var(--head); border-color: var(--head-fg); }
main { padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(84px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-width: 1100px; margin: 0 auto; }
.status { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; text-align: left; padding: 0; color: inherit; font: inherit; cursor: pointer; }
.card img { width: 100%; aspect-ratio: 245/342; object-fit: cover; background: var(--chip); display: block; }
.card .info { padding: 8px 10px 10px; display: grid; gap: 2px; min-width: 0; }
.card .name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .set { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .price { color: var(--price); font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.card .price small { color: var(--muted); font-weight: 500; }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }

/* Bottom tab bar */
nav.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
nav.tabbar button { border: 0; background: none; color: var(--muted); font: 600 11px var(--font); display: grid; justify-items: center; gap: 2px; padding: 4px 0; cursor: pointer; }
nav.tabbar svg { width: 24px; height: 24px; }
nav.tabbar button[aria-pressed="true"] { color: var(--accent); }

/* Dashboard */
.dash { display: grid; gap: 12px; margin-bottom: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.hero .label, .tile .label, .panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 4px; font-weight: 650; }
.hero .value { font-size: 34px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
.hero .sub { color: var(--muted); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.tile .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.bars { display: grid; gap: 8px; }
.barrow { display: grid; grid-template-columns: 92px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.barrow .track { height: 10px; border-radius: 0 4px 4px 0; background: var(--chip); overflow: hidden; }
.barrow .fill { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.barrow .v { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; min-width: 72px; }
.top { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.top li { display: flex; justify-content: space-between; gap: 8px; }
.top li span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top li span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
h2.section { font-size: 17px; margin: 6px 0 10px; }
.list { display: grid; gap: 8px; }
.entry { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; text-align: left; color: inherit; font: inherit; cursor: pointer; width: 100%; }
.entry img { width: 48px; aspect-ratio: 245/342; border-radius: 4px; object-fit: cover; background: var(--chip); }
.entry .mid { min-width: 0; display: grid; gap: 3px; }
.entry .name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { background: var(--chip); border-radius: 6px; padding: 1px 6px; font-size: 11px; font-weight: 600; color: var(--fg); }
.entry .right { text-align: right; font-variant-numeric: tabular-nums; }
.entry .right .total { font-weight: 700; color: var(--price); }
.entry .right .each { font-size: 12px; color: var(--muted); }

/* Sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface);
  border-radius: 18px 18px 0 0; max-height: 92vh; overflow-y: auto;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  max-width: 720px; margin: 0 auto;
}
.sheet .row { display: flex; gap: 14px; align-items: flex-start; }
.sheet .row img { width: 42%; max-width: 220px; border-radius: 10px; }
.sheet h2 { margin: 0 0 4px; font-size: 20px; text-wrap: balance; }
.meta { color: var(--muted); font-size: 13px; }
table { width: 100%; border-collapse: collapse; margin-top: 12px; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; font-weight: 600; }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; }
.actions { display: grid; gap: 8px; margin-top: 14px; }
.actions a, .actions button { display: block; text-align: center; text-decoration: none; }
.ghost { background: var(--chip); color: var(--fg); }
.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.close { float: right; border: 0; background: var(--chip); color: var(--fg); border-radius: 999px; width: 32px; height: 32px; font-size: 18px; }
fieldset.add { border: 1px solid var(--line); border-radius: 12px; margin: 16px 0 0; padding: 12px; display: grid; gap: 10px; }
fieldset.add legend { font-weight: 700; padding: 0 4px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fields label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
.fields select, .fields input { width: 100%; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); overflow: hidden; }
.stepper button { border: 0; background: none; color: var(--accent); font: 700 20px var(--font); width: 40px; height: 40px; cursor: pointer; }
.stepper input { border: 0 !important; text-align: center; background: transparent !important; padding: 0 !important; min-width: 0; -moz-appearance: textfield; }
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
.estimate { font-size: 13px; color: var(--muted); }
.estimate strong { color: var(--price); font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 40; }

/* Merkliste */
.wsum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.wsum .big { display: block; font-size: 26px; font-weight: 750; font-variant-numeric: tabular-nums; }
.wsum .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
.cv-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.scanbox { display: grid; gap: 12px; justify-items: center; text-align: center; }
.scanbtn { width: 100%; display: block; text-align: center; padding: 14px; font-size: 17px; }
.scanprev { max-height: 260px; border-radius: 10px; object-fit: contain; }
.lang-chip { background: var(--accent); color: var(--accent-fg); }
.dir { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; }
.dir.up { color: var(--up); } .dir.down { color: var(--down); } .dir.flat, .dir.none { color: var(--muted); }
.wrow .spark { display: block; margin-top: 4px; max-width: 100%; }
.wrow .now { font-weight: 700; font-variant-numeric: tabular-nums; }
.wnow { font-size: 26px; font-weight: 750; font-variant-numeric: tabular-nums; margin-top: 6px; }
.chartbox { position: relative; margin-top: 12px; }
.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
.tip { position: absolute; top: -6px; background: var(--fg); color: var(--bg); font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 380px) { .sheet .row { flex-direction: column; } .sheet .row img { width: 60%; } .barrow { grid-template-columns: 80px 1fr auto; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Kartenpreise</h1>
  <form class="search" id="search-form">
    <input id="q" type="search" placeholder="Kartenname, z. B. Glurak 30c" autocomplete="off" enterkeyhint="search">
    <button class="btn" type="submit">Suchen</button>
  </form>
  <select id="set-pick" aria-label="Set auswählen"><option value="">Alle Sets</option></select>
  <div class="lang" id="lang-row">Kartennamen:
    <button id="lang-de" aria-pressed="true">Deutsch</button>
    <button id="lang-en" aria-pressed="false">Englisch</button>
  </div>
</header>
<main>
  <p class="status" id="status"></p>
  <div id="view"></div>
</main>
<nav class="tabbar" aria-label="Bereiche">
  <button id="tab-search" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Suche</button>
  <button id="tab-coll" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="3" width="12" height="16" rx="2"/><path d="M8 21h10a2 2 0 0 0 2-2V7"/></svg>Sammlung</button>
  <button id="tab-scan" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Scannen</button>
  <button id="tab-watch" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Merkliste</button>
</nav>
<div class="sheet-bg" id="sheet-bg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>

<script>
const API = "https://api.tcgdex.net/v2";
const PAGE = 24;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const state = { lang: "de", view: "search", query: "" };
const cache = new Map();

const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let watch = store.get("watch", window.DEMO_WATCH_SEED || []);
let coll = store.get("coll", window.DEMO_SEED || []);
let collHist = store.get("collHist", window.DEMO_COLL_HIST || []); // [{d: Zeitpunkt, p: Sammlungswert}]
state.lang = store.get("lang", "de");

// Kartensprachen und Zustände wie bei Cardmarket
const LANGS = { de: "Deutsch", en: "Englisch", fr: "Französisch", it: "Italienisch", es: "Spanisch", pt: "Portugiesisch", ja: "Japanisch", ko: "Koreanisch", zh: "Chinesisch" };
const CONDS = {
  MT: { label: "Mint", f: 1.0 }, NM: { label: "Near Mint", f: 1.0 }, EX: { label: "Excellent", f: 0.85 },
  GD: { label: "Good", f: 0.7 }, LP: { label: "Light Played", f: 0.55 }, PL: { label: "Played", f: 0.4 }, PO: { label: "Poor", f: 0.25 }
};
const VARIANTS = { normal: "Normal", holo: "Holo / Reverse Holo" };

const eur = (n) => (typeof n === "number" && n > 0) ? n.toLocaleString("de-DE", { style: "currency", currency: "EUR" }) : "–";
// Viele ältere und ganz neue Karten haben in der Datenbank (noch) kein Bild: dann ein neutraler Platzhalter
const NO_IMG = "data:image/svg+xml;charset=utf-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 342"><rect width="245" height="342" rx="14" fill="#d9dfe9"/><rect x="12" y="12" width="221" height="318" rx="10" fill="#eef1f6"/><text x="122" y="168" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="16" fill="#6b7486">Kein Bild</text><text x="122" y="190" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8a93a5">in der Datenbank</text></svg>');
const img = (base, q) => base ? `${base}/${q}.webp` : NO_IMG;
document.addEventListener("error", e => { const t = e.target; if (t.tagName === "IMG" && t.src !== NO_IMG) t.src = NO_IMG; }, true);
const num = (v) => (typeof v === "number" && v > 0) ? v : null;

// Cardmarket-Sprachcodes: 1 Englisch, 2 Französisch, 3 Deutsch, 4 Spanisch, 5 Italienisch, 7 Japanisch, 8 Portugiesisch, 10 Koreanisch
const CM_LANG = { en: 1, fr: 2, de: 3, es: 4, it: 5, ja: 7, pt: 8, ko: 10 };
function cmUrl(name, cardLang) {
  // Cardmarket-Suche, Zustand ab Near Mint (2); ohne Sprachangabe Deutsch + Englisch
  const l = CM_LANG[cardLang] ? String(CM_LANG[cardLang]) : "1,3";
  return `https://www.cardmarket.com/de/Pokemon/Products/Search?category=-1&searchString=${encodeURIComponent(name)}&language=${l}&minCondition=2`;
}

// Cardmarket-Adressen nutzen den englischen Setnamen als Pfad, z. B. /Singles/30th-Celebration
const cmSlug = (t) => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/['’]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
async function cmSetUrl(id, cardLang) {
  const en = await getCard(id, "en");
  if (!en?.set?.name || !en.name) return null;
  const l = CM_LANG[cardLang] ? String(CM_LANG[cardLang]) : "1,3";
  return `https://www.cardmarket.com/de/Pokemon/Products/Singles/${cmSlug(en.set.name)}?searchString=${encodeURIComponent(en.name)}&language=${l}&minCondition=2`;
}
// Ersetzt im Sheet den Link der Namenssuche durch die Setseite, sobald der englische Setname geladen ist
async function upgradeCmLink(id, cardLang) {
  const a = document.querySelector("#sheet a.cm-link"); if (!a) return;
  const u = await cmSetUrl(id, cardLang);
  if (u && document.contains(a)) a.href = u;
}

async function getCard(id, lang) {
  const key = lang + ":" + id;
  if (cache.has(key)) return cache.get(key);
  const p = fetch(`${API}/${lang}/cards/${encodeURIComponent(id)}`).then(r => r.ok ? r.json() : null).catch(() => null);
  cache.set(key, p);
  return p;
}
const lowPrice = (cm) => cm ? (num(cm.low) ?? num(cm["low-holo"])) : null;
const trendPrice = (cm) => cm ? (num(cm.trend) ?? num(cm["trend-holo"])) : null;

// Marktpreis für eine Ausführung: Trend, sonst Durchschnitt, sonst ab-Preis
function marketPrice(cm, variant) {
  if (!cm) return null;
  if (variant === "holo") {
    const h = num(cm["trend-holo"]) ?? num(cm["avg-holo"]) ?? num(cm["low-holo"]);
    if (h) return h;
  }
  return num(cm.trend) ?? num(cm.avg) ?? num(cm.low) ?? num(cm["trend-holo"]);
}
function unitValue(e) {
  if (num(e.customPrice)) return e.customPrice;
  if (!num(e.price)) return null;
  return e.price * (CONDS[e.cond]?.f ?? 1);
}
const entryValue = (e) => (unitValue(e) ?? 0) * e.qty;
const saveColl = () => store.set("coll", coll);

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
}

/* ---------- Suche & Merkliste ---------- */
function cardTile(brief, full) {
  const b = document.createElement("button");
  b.className = "card"; b.type = "button";
  const cm = full?.pricing?.cardmarket;
  b.innerHTML = `<img loading="lazy" alt="${esc(brief.name)}" src="${esc(img(brief.image, "low"))}">
    <div class="info">
      <div class="name">${esc(brief.name)}</div>
      <div class="set">${full ? esc(`${full.set?.name ?? ""} · ${full.localId}`) : esc(`Nr. ${brief.localId ?? ""}`)}</div>
      ${full?.rarity ? `<div class="set">${esc(full.rarity)}${brief.lang && brief.lang !== state.lang ? " · nur " + (brief.lang === "en" ? "EN" : "DE") : ""}</div>` : ""}
      <div class="price">${full ? `ab ${eur(lowPrice(cm))} <small>· Trend ${eur(trendPrice(cm))}</small>` : "<small>Preis wird geladen…</small>"}</div>
    </div>`;
  b.addEventListener("click", () => openCardSheet(brief.id, brief.lang || state.lang));
  return b;
}
async function renderGrid(items, append) {
  const grid = document.createElement("div"); grid.className = "grid";
  if (append) { grid.style.marginTop = $("view").children.length ? "12px" : "0"; $("view").appendChild(grid); }
  else $("view").replaceChildren(grid);
  const tiles = items.map(it => { const t = cardTile(it, null); grid.appendChild(t); return t; });
  let i = 0;
  async function worker() {
    while (i < items.length) {
      const n = i++; const it = items[n];
      const full = await getCard(it.id, it.lang || state.lang);
      if (full) tiles[n].replaceWith(tiles[n] = cardTile(it, full));
    }
  }
  await Promise.all(Array.from({ length: 6 }, worker));
}
/* ---------- Sets und Setkürzel ---------- */
const setCache = {};
async function getSets(lang) {
  if (setCache[lang]) return setCache[lang];
  setCache[lang] = fetch(`${API}/${lang}/sets`).then(r => r.ok ? r.json() : []).catch(() => []);
  const list = await setCache[lang];
  if (!list.length) delete setCache[lang];
  return list;
}
const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9.]/g, "");
// Kürzel aus dem Setnamen: Zahlen bleiben, sonst Anfangsbuchstaben ("30th Celebration" -> "30c", "Paldea Evolved" -> "pe")
function initials(name) {
  return String(name || "").split(/[\s\-–:&]+/).filter(Boolean).map(w => /^\d/.test(w) ? w.match(/^\d+/)[0] : w[0]).join("").toLowerCase();
}
// Offizielle Kürzel (z. B. "MEW", "OBF", "PAL") stehen nur in den Set-Details; einmal laden und eine Woche merken
async function officialCodes(lang) {
  const key = "codes-" + lang, cached = store.get(key, null);
  if (cached && Date.now() - cached.t < 7 * 864e5) return cached.m;
  const sets = await getSets(lang), m = {};
  let i = 0;
  async function worker() {
    while (i < sets.length) {
      const st = sets[i++];
      const d = await fetch(`${API}/${lang}/sets/${encodeURIComponent(st.id)}`).then(r => r.ok ? r.json() : null).catch(() => null);
      [d?.tcgOnline, d?.abbreviation?.official, d?.abbreviation?.normal].forEach(c => { if (c) m[norm(c)] = st.id; });
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  if (Object.keys(m).length) store.set(key, { t: Date.now(), m });
  return m;
}
// Ein Set und seine Teil-Sets: gleicher Namensanfang („X: Classic Collection“) oder gleiche ID mit Zusatz („me55“ / „me55c“)
async function setGroup(set) {
  const all = await allSets();
  if (String(set.name).includes(":")) return [set]; // ein ausgewähltes Teil-Set bleibt für sich
  const base = norm(set.name);
  const g = all.filter(s => s.id === set.id || (base.length > 3 && norm(s.name.split(":")[0]) === base) || (s.id.startsWith(set.id) && /^[a-z]$/i.test(s.id.slice(set.id.length))));
  return g.length ? g : [set];
}
async function findSet(token, lang, deep) {
  const t = norm(token); if (!t || t.length < 2) return null;
  const sets = await getSets(lang);
  let hit = sets.find(s => norm(s.id) === t) || sets.find(s => initials(s.name) === t);
  if (!hit && deep) { const m = await officialCodes(lang); if (m[t]) hit = sets.find(s => s.id === m[t]); }
  return hit || null;
}
// Zerlegt "Glurak 30c" bzw. "Pikachu MEW 25" in Name, Set und Kartennummer
async function parseQuery(q, lang) {
  const parts = q.trim().split(/\s+/);
  let set = null, number = null;
  if (parts.length > 2 && /^\d{1,3}[a-z]?$/i.test(parts[parts.length - 1])) number = parts.pop();
  // Das letzte Wort ist ein Setkürzel, wenn davor noch ein Kartenname steht
  const tok = parts.length > 1 ? parts[parts.length - 1] : null;
  let setLang = lang;
  const SUFFIX = ["ex", "gx", "v", "vmax", "vstar", "lv", "break", "prime", "star", "delta", "mega", "tag", "team", "legend"];
  if (tok && tok.length <= 8 && !SUFFIX.includes(norm(tok))) {
    // erst in der eingestellten Sprache suchen, dann in der anderen (neue Sets gibt es oft zuerst nur auf Englisch)
    // zuerst schnelle Prüfung (Set-ID, Anfangsbuchstaben) in beiden Sprachen, erst dann die offiziellen Kürzel laden
    const langs = [lang, lang === "de" ? "en" : "de"];
    for (const deep of [false, true]) {
      if (set || (deep && tok.length > 5)) break;
      for (const l of langs) { set = await findSet(tok, l, deep); if (set) { setLang = l; break; } }
    }
    if (set) parts.pop();
  }
  if (!set && number) { parts.push(number); number = null; }
  return { name: parts.join(" "), set, number, setLang };
}
async function cardsOfSet(setId, lang) {
  const key = "set:" + lang + ":" + setId;
  if (!cache.has(key)) cache.set(key, fetch(`${API}/${lang}/sets/${encodeURIComponent(setId)}`).then(r => r.ok ? r.json() : null).catch(() => null));
  return cache.get(key);
}

/* ---------- Suche über beide Sprachen ---------- */
const OTHER = (l) => l === "de" ? "en" : "de";
async function fetchPages(url) {
  const out = [];
  for (let page = 1; page <= 4; page++) {
    const r = await fetch(`${url}&pagination:page=${page}&pagination:itemsPerPage=100`);
    if (!r.ok) { if (page === 1) throw new Error(r.status); break; }
    const part = await r.json();
    if (!Array.isArray(part)) break;
    out.push(...part);
    if (part.length < 100) break;
  }
  return out;
}
// Führt Trefferlisten aus beiden Sprachen über die Karten-ID zusammen; die eingestellte Sprache hat Vorrang
function mergeById(primary, secondary) {
  const m = new Map();
  primary.forEach(c => m.set(c.id, c));
  secondary.forEach(c => {
    const p = m.get(c.id);
    if (!p) m.set(c.id, c);
    else if (!p.image && c.image) m.set(c.id, { ...p, image: c.image }); // Bild aus der anderen Sprache übernehmen
  });
  return [...m.values()];
}
async function nameSearch(q) {
  const L = state.lang, O = OTHER(L);
  const enc = encodeURIComponent(q);
  // 1) Name in beiden Datenbanken suchen (für Namen wie „Pikachu“ oder „Zubat“, die in beiden Sprachen gleich sind)
  const [a, b] = await Promise.all([
    fetchPages(`${API}/${L}/cards?name=${enc}`).catch(() => null),
    fetchPages(`${API}/${O}/cards?name=${enc}`).catch(() => [])
  ]);
  if (a === null) throw new Error("api");
  let list = mergeById(a.map(c => ({ ...c, lang: L })), b.map(c => ({ ...c, lang: O })));
  // Schreibweisen angleichen: „Glurak ex“ soll auch „Glurak-ex“ finden. Dazu nach dem ersten Wort suchen und lokal filtern.
  const first = q.split(/[\s\-]+/)[0];
  if (first && first !== q) {
    const nq = norm(q);
    const [c2, d2] = await Promise.all([L, O].map(l => fetchPages(`${API}/${l}/cards?name=${encodeURIComponent(first)}`).then(r => r.filter(c => norm(c.name).includes(nq)).map(c => ({ ...c, lang: l }))).catch(() => [])));
    list = mergeById(mergeById(list.filter(c => c.lang === L), c2), mergeById(list.filter(c => c.lang === O), d2));
  }
  // 2) Übersetzen: Name derselben Karte in der anderen Sprache nachschlagen („Glurak-ex“ -> „Charizard ex“ -> „Charizard“)
  //    und damit in beiden Datenbanken weitersuchen. So fehlen keine Karten, die es nur in einer Sprache gibt.
  const words = extraWords(q);
  const bases = new Map(); // Sprache -> Set von Grundnamen
  await Promise.all(list.slice(0, 6).map(async c => {
    for (const l of [L, O]) {
      const f = l === c.lang ? await getCard(c.id, l) : await getCard(c.id, l);
      const base = baseName(f?.name);
      if (base && norm(base) !== norm(q)) { if (!bases.has(l)) bases.set(l, new Set()); bases.get(l).add(base); }
    }
  }));
  const extra = await Promise.all([...bases].flatMap(([l, set]) => [...set].slice(0, 2).map(nm =>
    fetchPages(`${API}/${l}/cards?name=${encodeURIComponent(nm)}`).then(r => r.map(c => ({ ...c, lang: l }))).catch(() => [])
  )));
  const fit = (c) => !words.length || words.every(w => norm(c.name).includes(w));
  const all = extra.flat().filter(fit);
  return mergeById(mergeById(list.filter(c => c.lang === L), all.filter(c => c.lang === L)), mergeById(list.filter(c => c.lang === O), all.filter(c => c.lang === O)));
}
// Grundname eines Pokémon ohne Zusätze: „Mega Charizard X ex“ -> „Charizard“, „Glurak-ex“ -> „Glurak“
const NAME_EXTRAS = new Set(["ex", "gx", "v", "vmax", "vstar", "break", "prime", "legend", "lv", "lvx", "mega", "m", "x", "y", "radiant", "strahlendes", "strahlender", "strahlende", "dark", "light", "shining", "star", "delta", "team", "rockets", "tag", "team", "and", "&", "δ", "◇", "☆"]);
function baseName(n) {
  if (!n) return "";
  const toks = String(n).replace(/[-’']s?\b/g, " ").split(/[\s\-]+/).filter(t => t && !NAME_EXTRAS.has(norm(t)) && norm(t).length > 1);
  return toks[0] || "";
}
const extraWords = (q) => String(q).toLowerCase().split(/[\s\-]+/).slice(1).map(norm).filter(w => w && w.length > 0);
async function setCards(setId) {
  const L = state.lang, O = OTHER(L);
  const [a, b] = await Promise.all([cardsOfSet(setId, L), cardsOfSet(setId, O)]);
  if (!a && !b) return null;
  const cards = mergeById((a?.cards || []).map(c => ({ ...c, lang: L })), (b?.cards || []).map(c => ({ ...c, lang: O })));
  const total = Math.max(a?.cardCount?.total || 0, b?.cardCount?.total || 0, a?.cardCount?.official || 0, b?.cardCount?.official || 0);
  return Object.assign(cards, { total });
}

// Seltenheit als Rangzahl (deutsch und englisch), höher = seltener
const RARITY_RANK = [
  [/mega hyper/, 100], [/hyper/, 95], [/special illustration|spezielle illustration|besondere illustration/, 90],
  [/secret|geheim/, 88], [/rainbow|regenbogen/, 87], [/gold/, 86], [/black white|schwarz.?weiss/, 85],
  [/shiny ultra|schillernde ultra/, 82], [/ultra/, 80], [/illustration/, 75], [/ace spec/, 70],
  [/shiny|schillernd/, 68], [/amazing|radiant|strahlend|fantastisch/, 65],
  [/vmax|vstar|double|doppel/, 60], [/holo v\b|rare v\b/, 58], [/prime|legend|break|full art/, 55],
  [/holo/, 40], [/uncommon|nicht so haufig/, 20], [/common|haufig/, 10], [/rare|selten/, 30]
];
function rarityRank(r) {
  const s = String(r || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  if (!s || s === "none") return 5;
  for (const [re, v] of RARITY_RANK) if (re.test(s)) return v;
  return 25;
}
const localNum = (id) => parseInt(String(id).replace(/\D/g, ""), 10) || 0;

async function search(q) {
  q = (q || "").trim();
  state.query = q;
  const status = $("status");
  const setId = $("set-pick").value;
  if (!q && !setId) { status.textContent = ""; $("view").innerHTML = `<p class="empty">Gib einen Kartennamen ein oder wähle oben ein Set, zum Beispiel „Glurak“, „Glurak 30c“ oder nur das Set „30th Celebration“.</p>`; return; }
  status.textContent = "Suche läuft…"; $("view").innerHTML = "";
  const token = state.token = {};
  try {
    let list, label, set = null, number = null, name = q;
    if (setId) {
      set = (await allSets()).find(s => s.id === setId) || { id: setId, name: setId };
    } else {
      const pq = await parseQuery(q, state.lang);
      if (pq.set) { set = pq.set; name = pq.name; number = pq.number; }
    }
    let coverage = "";
    if (set) {
      // Teil-Sets mitnehmen, z. B. „30th Celebration“ + „30th Celebration: Classic Collection“ (beide Kürzel 30C)
      const group = await setGroup(set);
      const parts = await Promise.all(group.map(g => setCards(g.id)));
      const ok = parts.filter(Boolean);
      const cards = ok.length ? Object.assign(mergeById(ok.flat(), []), { total: ok.reduce((t, x) => t + (x.total || 0), 0) }) : null;
      if (group.length > 1) set = { ...set, name: set.name + " inkl. " + group.filter(g => g.id !== set.id).map(g => g.name.split(":").pop().trim()).join(", ") };
      if (!cards) throw new Error("set");
      if (!cards.length) { status.textContent = `Für das Set ${set.name} enthält die Kartendatenbank noch keine Karten, weder auf Deutsch noch auf Englisch.`; $("view").innerHTML = ""; return; }
      if (cards.total && cards.length < cards.total) coverage = ` Hinweis: Die Kartendatenbank enthält von diesem Set bisher erst ${cards.length} von ${cards.total} Karten.`;
      // Details aller Setkarten laden: für die Seltenheit und um Namen sprachübergreifend über die Pokédex-Nummer zu erkennen
      let done = 0, i = 0;
      const full = new Array(cards.length);
      status.textContent = `Lade ${cards.length} Karten aus ${set.name}… 0/${cards.length}`;
      async function worker() {
        while (i < cards.length) {
          const k = i++;
          full[k] = await getCard(cards[k].id, cards[k].lang);
          done++;
          if (state.token === token && done % 10 === 0) status.textContent = `Lade ${cards.length} Karten aus ${set.name}… ${done}/${cards.length}`;
        }
      }
      await Promise.all(Array.from({ length: 10 }, worker));
      if (state.token !== token) return;
      const n = norm(name);
      let ids = new Set(), qDex = new Set();
      if (n) {
        const hits = await nameSearch(name).catch(() => []);
        ids = new Set(hits.map(c => c.id));
        await Promise.all(hits.slice(0, 6).map(async c => ((await getCard(c.id, c.lang))?.dexId || []).forEach(d => qDex.add(d))));
      }
      const words = extraWords(name);
      const numOk = (c) => !number || String(c.localId).replace(/^0+/, "").toLowerCase() === number.replace(/^0+/, "").toLowerCase();
      list = cards.map((c, k) => ({ ...c, rarity: full[k]?.rarity, rank: rarityRank(full[k]?.rarity), dex: full[k]?.dexId || [] }))
        .filter(c => numOk(c) && (!n || norm(c.name).includes(n) || ids.has(c.id) ||
          (c.dex.some(d => qDex.has(d)) && words.every(w => norm(c.name).includes(w)))))
        .sort((x, y) => y.rank - x.rank || localNum(y.localId) - localNum(x.localId));
      if (!list.length && !setId) { coverage = coverage || ""; const fb = await nameSearch(q).catch(() => []); if (fb.length) { set = null; list = fb; } }
    } else list = await nameSearch(q);
    if (state.token !== token) return;
    label = set ? `${name ? "„" + name + "“ im Set " : "Set "}${set.name}${number ? ", Nr. " + number : ""}` : `„${q}“`;
    if (!list.length) { status.textContent = `Keine Karten zu ${label} gefunden. Prüfe die Schreibweise.${coverage}`; return; }
    status.textContent = `${list.length} Karten zu ${label}${set ? ", seltenste zuerst" : ""}. Preise von Cardmarket.${coverage}`;
    state.results = list; state.shown = 0;
    $("view").replaceChildren();
    showMore();
  } catch {
    if (state.token === token) status.textContent = "Die Kartendatenbank ist gerade nicht erreichbar. Prüfe deine Internetverbindung und versuche es noch einmal.";
  }
}

// Setliste für das Auswahlfeld: beide Sprachen zusammengeführt, neueste zuerst
let setsMerged = null;
async function allSets() {
  if (setsMerged) return setsMerged;
  const L = state.lang, O = OTHER(L);
  const [a, b] = await Promise.all([getSets(L), getSets(O)]);
  const m = new Map();
  const count = (s) => s.cardCount?.total ?? s.cardCount?.official ?? 1;
  (b || []).forEach((s, i) => m.set(s.id, { id: s.id, name: s.name, order: i, n: count(s) }));
  (a || []).forEach((s, i) => m.set(s.id, { id: s.id, name: s.name, order: m.get(s.id)?.order ?? i, n: Math.max(count(s), m.get(s.id)?.n ?? 0) }));
  [...m.values()].forEach(s => { if (!s.n) m.delete(s.id); }); // Sets ohne Karten ausblenden
  setsMerged = [...m.values()].sort((x, y) => y.order - x.order);
  if (!setsMerged.length) setsMerged = null;
  return setsMerged || [];
}
async function fillSetPicker() {
  const sel = $("set-pick"), keep = sel.value;
  const sets = await allSets();
  sel.innerHTML = `<option value="">Alle Sets</option>` + sets.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");
  if (keep && sets.some(s => s.id === keep)) sel.value = keep;
}

// Ergebnisse in Blöcken anzeigen, Preise werden pro Block nachgeladen
function showMore() {
  const items = state.results.slice(state.shown, state.shown + PAGE);
  state.shown += items.length;
  $("more")?.remove();
  renderGrid(items, true);
  if (state.shown < state.results.length) {
    const b = document.createElement("button");
    b.id = "more"; b.className = "btn ghost"; b.style.cssText = "width:100%;margin-top:14px";
    b.textContent = `Weitere ${Math.min(PAGE, state.results.length - state.shown)} von ${state.results.length - state.shown} laden`;
    b.onclick = showMore;
    $("view").appendChild(b);
  }
}
/* ---------- Merkliste mit Preis-Tracking ---------- */
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const fmtDate = (d) => String(d).length > 10
  ? new Date(d).toLocaleString("de-DE", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
  : new Date(d + "T12:00:00").toLocaleDateString("de-DE", { day: "numeric", month: "short" });
const pct = (v) => (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toLocaleString("de-DE", { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + " %";

// Ein Preispunkt pro Tag (Cardmarket-Trendpreis); der Punkt von heute wird bei Änderungen überschrieben
function recordPoint(w, cm) {
  if (!cm) return false;
  if (num(cm.avg7)) w.avg7 = cm.avg7;
  if (num(cm.avg30)) w.avg30 = cm.avg30;
  // Verfolgt wird der Cardmarket-Ab-Preis (günstigstes Angebot); der Trendpreis wird mitgespeichert.
  // Ein selbst eingetragener Preis (own) hat Vorrang vor beiden.
  const low = num(cm.low) ?? num(cm["low-holo"]), trend = marketPrice(cm, "normal");
  if (!low && !trend) return false;
  w.history = w.history || [];
  const d = today(), last = w.history[w.history.length - 1];
  if (last && last.d === d) {
    if (last.low === low && last.trend === trend) return false;
    last.low = low; last.trend = trend; last.p = last.own ?? low ?? trend;
  } else w.history.push({ d, low, trend, p: low ?? trend });
  if (!w.addedAt) w.addedAt = w.history[0].d;
  return true;
}
let watchRefresh = null;
function refreshWatch() {
  watchRefresh = watchRefresh || Promise.all(watch.map(async w => {
    const c = await getCard(w.id, w.lang);
    const fill = c?.set?.name && !w.set ? (w.set = c.set.name, true) : false;
    return recordPoint(w, c?.pricing?.cardmarket) || fill;
  })).then(r => { if (r.some(Boolean)) store.set("watch", watch); watchRefresh = null; return r.some(Boolean); });
  return watchRefresh;
}
function trendOf(w) {
  const h = w.history || [];
  if (h.length >= 2) {
    const a = h[0].p, b = h[h.length - 1].p, ch = (b - a) / a * 100;
    return { dir: ch > 2 ? "up" : ch < -2 ? "down" : "flat", ch, start: a, now: b, own: true };
  }
  // Noch kein eigener Verlauf: Cardmarket-Durchschnitt 7 Tage gegen 30 Tage
  const now = h.length ? h[0].p : null;
  if (num(w.avg7) && num(w.avg30)) {
    const ch = (w.avg7 - w.avg30) / w.avg30 * 100;
    return { dir: ch > 3 ? "up" : ch < -3 ? "down" : "flat", ch, start: now, now, own: false };
  }
  return { dir: "none", ch: 0, start: now, now, own: false };
}
const DIR = {
  up: { label: "wird teurer", arrow: "▲" }, down: { label: "wird günstiger", arrow: "▼" },
  flat: { label: "stabil", arrow: "■" }, none: { label: "noch keine Daten", arrow: "·" }
};
function sparkSvg(h, w = 120, ht = 32) {
  if (!h || !h.length) return "";
  const ps = h.map(x => x.p), min = Math.min(...ps), max = Math.max(...ps), span = max - min || 1;
  const x = (i) => h.length === 1 ? w - 4 : 3 + i * (w - 7) / (h.length - 1);
  const y = (v) => max === min ? ht / 2 : 3 + (max - v) * (ht - 6) / span;
  const pts = h.map((p, i) => `${x(i).toFixed(1)},${y(p.p).toFixed(1)}`).join(" ");
  const last = h.length - 1;
  return `<svg class="spark" viewBox="0 0 ${w} ${ht}" width="${w}" height="${ht}" aria-hidden="true">
    ${h.length > 1 ? `<polygon points="${x(0)},${ht} ${pts} ${x(last)},${ht}" fill="var(--bar)" opacity=".12"/><polyline points="${pts}" fill="none" stroke="var(--bar)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    <circle cx="${x(last)}" cy="${y(h[last].p)}" r="3.5" fill="var(--bar)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}
function renderWatch() {
  if (!watch.length) { $("status").textContent = ""; $("view").innerHTML = `<p class="empty">Noch keine Karten gemerkt. Öffne eine Karte und tippe auf „Merken“. Ab dann zeichnet die App den Preis jeden Tag auf, an dem du sie öffnest.</p>`; return; }
  $("status").textContent = "";
  const ts = watch.map(trendOf);
  const n = (d) => ts.filter(t => t.dir === d).length;
  $("view").innerHTML = `
    <div class="panel wsum">
      <div><span class="big">${n("up")}</span><span class="lbl"><span class="dir up">▲</span> teurer</span></div>
      <div><span class="big">${n("down")}</span><span class="lbl"><span class="dir down">▼</span> günstiger</span></div>
      <div><span class="big">${n("flat")}</span><span class="lbl"><span class="dir flat">■</span> stabil</span></div>
    </div>
    <p class="note" style="margin:8px 0 14px">Veränderung seit du die Karte gemerkt hast, gemessen am Cardmarket-ab-Preis (günstigstes Angebot über alle Sprachen und Zustände) oder an deinen selbst eingetragenen Preisen. Solange es nur einen Messpunkt gibt, zeigt die Tendenz den Cardmarket-Schnitt der letzten 7 gegen 30 Tage.</p>
    <div class="list" id="wl"></div>`;
  const list = $("wl");
  watch.map((w, i) => ({ w, t: ts[i], i })).sort((a, b) => Math.abs(b.t.ch) - Math.abs(a.t.ch)).forEach(({ w, t, i }) => {
    const b = document.createElement("button"); b.className = "entry wrow"; b.type = "button";
    b.innerHTML = `<img alt="" loading="lazy" src="${esc(img(w.image, "low"))}">
      <div class="mid"><div class="name">${esc(w.name)}</div>
        <div class="chips"><span class="chip lang-chip">${esc(LANGS[w.cardLang || w.lang] ?? w.cardLang)}</span>${w.set ? `<span class="chip">${esc(w.set)} · ${esc(w.localId ?? "")}</span>` : ""}</div>
        <div class="meta">gemerkt ${w.addedAt ? "am " + fmtDate(w.addedAt) : "heute"} · ${t.start ? eur(t.start) : "–"}</div>
        ${sparkSvg(w.history)}</div>
      <div class="right"><div class="now">${eur(t.now)}</div>
        <div class="dir ${t.dir}">${DIR[t.dir].arrow} ${t.dir === "none" ? "–" : pct(t.ch)}</div>
        <div class="each">${DIR[t.dir].label}${t.own || t.dir === "none" ? "" : "*"}</div></div>`;
    b.addEventListener("click", () => openWatchSheet(i));
    list.appendChild(b);
  });
}
function chartSvg(h, start) {
  const W = 340, H = 170, L = 8, R = 62, T = 12, B = 24;
  const ps = h.map(x => x.p), min = Math.min(...ps, start ?? Infinity), max = Math.max(...ps, start ?? -Infinity);
  const pad = (max - min) * 0.12 || max * 0.05 || 1, lo = min - pad, hi = max + pad;
  const t0 = new Date(h[0].d).getTime(), t1 = new Date(h[h.length - 1].d).getTime(), span = t1 - t0 || 1;
  const x = (d) => h.length === 1 ? W - R : L + (new Date(d).getTime() - t0) / span * (W - L - R);
  const y = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
  const pts = h.map(p => `${x(p.d).toFixed(1)},${y(p.p).toFixed(1)}`).join(" ");
  const ticks = [hi - pad, (hi + lo) / 2, lo + pad];
  const last = h[h.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Preisverlauf">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${W - R + 6}" y="${y(v) + 4}" font-size="11" fill="var(--muted)">${eur(v)}</text>`).join("")}
    ${start ? `<line x1="${L}" x2="${W - R}" y1="${y(start)}" y2="${y(start)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>` : ""}
    ${h.length > 1 ? `<polygon points="${x(h[0].d)},${H - B} ${pts} ${x(last.d)},${H - B}" fill="var(--bar)" opacity=".12"/><polyline points="${pts}" fill="none" stroke="var(--bar)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${h.filter(p => num(p.own)).map(p => `<circle cx="${x(p.d)}" cy="${y(p.p)}" r="5" fill="var(--surface)" stroke="var(--bar)" stroke-width="2"/>`).join("")}
    <circle cx="${x(last.d)}" cy="${y(last.p)}" r="4.5" fill="var(--bar)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${L}" y="${H - 6}" font-size="11" fill="var(--muted)">${fmtDate(h[0].d)}</text>
    <text x="${W - R}" y="${H - 6}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtDate(last.d)}</text>
    <line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
    <circle class="hov" r="4.5" fill="var(--bar)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" class="hit"/>
  </svg>`;
}
function wireChart(box, h) {
  const svg = box.querySelector("svg.chart"); if (!svg || h.length < 2) return;
  const tip = box.querySelector(".tip"), cross = svg.querySelector(".cross"), hov = svg.querySelector(".hov");
  const pts = [...svg.querySelector("polyline").getAttribute("points").split(" ")].map(s => s.split(",").map(Number));
  const move = (ev) => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * 340;
    let k = 0; pts.forEach((p, i) => { if (Math.abs(p[0] - sx) < Math.abs(pts[k][0] - sx)) k = i; });
    const [px, py] = pts[k];
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    hov.setAttribute("cx", px); hov.setAttribute("cy", py); hov.setAttribute("visibility", "visible");
    tip.hidden = false; tip.textContent = `${fmtDate(h[k].d)}: ${eur(h[k].p)}${num(h[k].own) ? " (dein Preis)" : ""}`;
    tip.style.left = Math.min(Math.max(px / 340 * r.width - 50, 0), r.width - 110) + "px";
  };
  const hide = () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); hov.setAttribute("visibility", "hidden"); };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move); svg.addEventListener("pointerleave", hide);
}
function openWatchSheet(i) {

/* ---------- Sammlung & Dashboard ---------- */
async function refreshPrices() {
  const keys = [...new Set(coll.map(e => e.dataLang + "|" + e.id))];
  let changed = false;
  await Promise.all(keys.map(async k => {
    const [lang, id] = k.split("|");
    const c = await getCard(id, lang);
    const cm = c?.pricing?.cardmarket;
    if (!cm) return;
    coll.forEach(e => {
      if (e.id === id && e.dataLang === lang) {
        const p = marketPrice(cm, e.variant);
        if (p && p !== e.price) { e.price = p; changed = true; }
        if (cm.updated) e.priceDate = cm.updated;
      }
    });
  }));
  if (changed) saveColl();
  return changed;
}
function groupSum(key, labels) {
  const m = new Map();
  coll.forEach(e => m.set(e[key], (m.get(e[key]) ?? 0) + entryValue(e)));
  return [...m.entries()].map(([k, v]) => ({ label: labels[k] ?? k, v })).sort((a, b) => b.v - a.v);
}
function barsHtml(rows) {
  const max = Math.max(...rows.map(r => r.v), 0.01);
  return `<div class="bars">${rows.map(r => `<div class="barrow" title="${esc(r.label)}: ${eur(r.v)}">
    <span>${esc(r.label)}</span><div class="track"><div class="fill" style="width:${(r.v / max * 100).toFixed(1)}%"></div></div><span class="v">${eur(r.v)}</span></div>`).join("")}</div>`;
}
// Bei jedem Öffnen der App: Preise aktualisieren und den Sammlungswert als neuen Punkt speichern
async function recordCollValue() {
  if (!coll.length) return;
  await refreshPrices();
  const total = coll.reduce((s, e) => s + entryValue(e), 0);
  if (!(total > 0)) return;
  // Wert je Eintrag mitspeichern, damit gelöschte Karten später aus dem Verlauf herausgerechnet werden können
  const parts = {}; coll.forEach(e => { const v = entryValue(e); if (v > 0) parts[e.uid] = Math.round(v * 100) / 100; });
  collHist.push({ d: new Date().toISOString(), p: Math.round(total * 100) / 100, e: parts });
  if (collHist.length > 1000) collHist = collHist.slice(-1000);
  store.set("collHist", collHist);
  if (state.view === "coll") renderColl();
}
// Entfernt den Anteil einer gelöschten Karte aus allen Messpunkten der Wertentwicklung
function removeFromHist(entry) {
  const created = parseInt(String(entry.uid).slice(0, -4), 36); // Zeitpunkt des Hinzufügens steckt in der ID
  const fallback = entryValue(entry); // ältere Messpunkte ohne Aufschlüsselung: aktueller Wert als Näherung
  collHist = collHist.map(pt => {
    let p = pt.p;
    if (pt.e) { if (pt.e[entry.uid] != null) { p -= pt.e[entry.uid]; const e = { ...pt.e }; delete e[entry.uid]; return { ...pt, p: Math.round(p * 100) / 100, e }; } return pt; }
    if (!isNaN(created) && new Date(pt.d).getTime() >= created) p -= fallback;
    return { ...pt, p: Math.round(p * 100) / 100 };
  }).filter(pt => pt.p > 0.004);
  store.set("collHist", collHist);
}
function collChartHtml(total, invested) {
  const h = collHist;
  if (!h.length) return `<p class="note" style="margin:0">Der Verlauf startet beim nächsten Öffnen der App.</p>`;
  const first = h[0].p, last = h[h.length - 1].p, ch = (last - first) / first * 100;
  const dir = h.length < 2 ? "none" : ch > 0.5 ? "up" : ch < -0.5 ? "down" : "flat";
  return `<div class="cv-head"><span class="dir ${dir === "up" ? "down" : dir === "down" ? "up" : dir}">${h.length < 2 ? "" : (ch >= 0 ? "▲ " : "▼ ") + pct(ch)}</span>
      <span class="meta">${h.length < 2 ? "Erster Messpunkt gespeichert. Ab dem nächsten Öffnen entsteht die Kurve." : `seit ${fmtDate(h[0].d)} · ${h.length} Messpunkte`}</span></div>
    <div class="chartbox"><div class="tip" hidden></div>${chartSvg(h, num(invested) ? invested : null)}</div>
    ${num(invested) ? `<p class="note" style="margin-top:4px">Gestrichelte Linie: dein Kaufpreis für die ganze Sammlung (${eur(invested)}).</p>` : ""}
    ${Math.abs(total - last) > 0.005 ? `<p class="note" style="margin-top:4px">Aktueller Wert nach deinen letzten Änderungen: ${eur(total)}. Er kommt beim nächsten Öffnen als Punkt dazu.</p>` : ""}`;
}
function renderColl() {
  const status = $("status");
  if (!coll.length) {
    status.textContent = "";
    $("view").innerHTML = `<p class="empty">Deine Sammlung ist noch leer. Such eine Karte, öffne sie und trag unter „Zur Sammlung hinzufügen“ Anzahl, Sprache und Zustand ein. Hier siehst du dann den Gesamtwert.</p>`;
    return;
  }
  status.textContent = "";
  const total = coll.reduce((s, e) => s + entryValue(e), 0);
  const count = coll.reduce((s, e) => s + e.qty, 0);
  const unique = new Set(coll.map(e => e.id)).size;
  const missing = coll.filter(e => unitValue(e) == null).length;
  const sorted = [...coll].sort((a, b) => entryValue(b) - entryValue(a));
  const best = [...coll].sort((a, b) => (unitValue(b) ?? 0) - (unitValue(a) ?? 0))[0];
  // Gewinn/Verlust: nur Einträge mit Kaufpreis und aktuellem Wert
  const bought = coll.filter(e => num(e.buyPrice) && unitValue(e) != null);
  const invested = bought.reduce((s, e) => s + e.buyPrice * e.qty, 0);
  const boughtNow = bought.reduce((s, e) => s + entryValue(e), 0);
  const pl = boughtNow - invested;
  const dates = coll.map(e => e.priceDate).filter(Boolean).sort();
  const stand = dates.length ? new Date(dates[dates.length - 1]).toLocaleDateString("de-DE") : null;

  $("view").innerHTML = `

    </div>
    ${bought.length ? `<div class="tiles">

    </div>` : `<p class="note" style="margin:0">Tipp: Trag bei deinen Karten den Kaufpreis ein (Karte antippen), dann siehst du hier Gewinn und Verlust seit dem Kauf.</p>`}
    <div class="panel"><h3>Wertentwicklung</h3>${collChartHtml(total, bought.length === coll.length ? invested : null)}
      ${collHist.length ? `<button class="btn danger" id="hist-reset" style="width:100%;margin-top:10px">Verlauf zurücksetzen</button>` : ""}</div>
    <div class="tiles">
      <div class="panel tile"><p class="label">Wertvollste Karte</p><div class="value">${eur(unitValue(best))}</div><div class="sub">${esc(best.name)}</div></div>
      <div class="panel tile"><p class="label">Ø pro Karte</p><div class="value">${eur(count ? total / count : 0)}</div><div class="sub">über alle Exemplare</div></div>
    </div>
    <div class="two">
      <div class="panel"><h3>Wert nach Sprache</h3>${barsHtml(groupSum("cardLang", LANGS))}</div>
      <div class="panel"><h3>Wert nach Zustand</h3>${barsHtml(groupSum("cond", Object.fromEntries(Object.entries(CONDS).map(([k, v]) => [k, v.label]))))}</div>
    </div>
    <div class="panel"><h3>Top 5</h3><ol class="top">${sorted.slice(0, 5).map(e => `<li><span>${e.qty}× ${esc(e.name)}</span><span>${eur(entryValue(e))}</span></li>`).join("")}</ol></div>
    <p class="note">Der Wert ist eine Schätzung: Cardmarket-Trendpreis der Karte, angepasst an den Zustand (Excellent 85 %, Good 70 %, Light Played 55 %, Played 40 %, Poor 25 %). Die Sprache fließt nicht ein, weil Cardmarket keinen Preis pro Sprache liefert. Mit einem eigenen Preis bei der Karte kannst du die Schätzung überschreiben.</p>
  </section>
  <h2 class="section">Deine Karten</h2>
  <div class="list" id="entries"></div>`;
  wireChart($("view").querySelector(".panel .chartbox")?.parentElement || $("view"), collHist);
  const hr = $("hist-reset");
  if (hr) { let armed = false; hr.onclick = () => {
    if (!armed) { armed = true; hr.textContent = "Wirklich? Alle Messpunkte werden gelöscht. Nochmal tippen"; return; }
    // Neustart: alter Verlauf weg, sofort ein frischer Messpunkt mit dem aktuellen Wert

    const total = coll.reduce((s, e) => s + entryValue(e), 0);
    if (total > 0) { const parts = {}; coll.forEach(e => { const v = entryValue(e); if (v > 0) parts[e.uid] = Math.round(v * 100) / 100; });
      collHist.push({ d: new Date().toISOString(), p: Math.round(total * 100) / 100, e: parts }); store.set("collHist", collHist); }
    renderColl(); toast("Verlauf zurückgesetzt");
  }; }
  const list = $("entries");
  sorted.forEach(e => {
    const b = document.createElement("button"); b.className = "entry"; b.type = "button";
    const u = unitValue(e);

    b.addEventListener("click", () => openEntrySheet(e.uid));
    list.appendChild(b);

}

const parseEur = (v) => num(parseFloat(String(v || "").replace(/\s|€/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".")));
function readForm() {

// Texterkennung (Tesseract) läuft komplett auf dem Gerät; Skript und Sprachdaten werden beim ersten Scan geladen.

    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
  } catch { src = await createImageBitmap(file); }

}

}

function estimateSkew(canvas) {

function rotatedSize(base, angle) {

function boxMean(a, w, h, r) {

  if (f.total) {
    const [a, b] = await Promise.all([getSets(state.lang), getSets(OTHER(state.lang))]);
    const byTotal = [...a, ...b].filter(s => String(s.cardCount?.official) === String(parseInt(f.total, 10)));
    const ids = new Set(cand.map(s => s.id)); const both = byTotal.filter(s => ids.has(s.id));
    cand = both.length ? both : [...cand, ...byTotal];
  }
  const seen = new Set(); cand = cand.filter(s => !seen.has(s.id) && seen.add(s.id)).slice(0, 15);
  if (f.number && cand.length) (await Promise.all(cand.map(s => setCards(s.id)))).forEach(list => (list || []).forEach(c => { if (sameNum(c.localId, f.number)) add(c, 1 + bestSim(f, c.name)); }));
  if (!out.size && (f.name || f.names?.length)) {
    const tries = [...new Set([f.name, ...(f.names || [])])].filter(Boolean).slice(0, 5);
    for (const t of tries) { const hits = await nameSearch(t).catch(() => []); hits.slice(0, 80).forEach(c => add(c, bestSim(f, c.name) + (f.number && sameNum(c.localId, f.number) ? 1 : 0))); if ([...out.values()].some(c => c.score >= 0.9)) break; }
    [...out.values()].forEach(c => { if (c.score < 0.5) out.delete(c.id); });
  }
  return [...out.values()].sort((x, y) => y.score - x.score).slice(0, 24);
}
function scanFieldsHtml(f) {
  return `<fieldset class="add"><legend>Erkannte Angaben (bei Bedarf korrigieren)</legend>
    <div class="fields">
      <label style="grid-column:1/-1">Name<input id="s-name" type="text" list="s-names" value="${esc(f.name)}" placeholder="z. B. Gengar-ex"><datalist id="s-names">${(f.names || []).map(n => `<option value="${esc(n)}">`).join("")}</datalist></label>
      <label>Kartennummer<input id="s-num" type="text" value="${esc(f.number)}" placeholder="z. B. 154"></label>
      <label>von (Gesamtzahl)<input id="s-total" type="text" inputmode="numeric" value="${esc(f.total)}" placeholder="z. B. 128"></label>
      <label>Setkürzel<input id="s-code" type="text" value="${esc(f.code)}" placeholder="z. B. 30C"></label>
      <label>Sprache der Karte<select id="s-lang"><option value="">unbekannt</option>${Object.entries(LANGS).map(([k, v]) => `<option value="${k}"${k === f.lang ? " selected" : ""}>${esc(v)}</option>`).join("")}</select></label>
    </div>
    <button class="btn" id="s-search">Mit diesen Angaben suchen</button>
  </fieldset>`;
}
function renderScan() {
  $("status").textContent = "";
  if (!tessWorker && !tessPromise) getTess().catch(() => {}); // Texterkennung schon vor dem Foto laden
  $("view").innerHTML = `
    <div class="panel scanbox">
      <label class="btn scanbtn" for="s-file">${scan.img ? "Neues Foto aufnehmen" : "Karte fotografieren"}</label>
      <input id="s-file" type="file" accept="image/*" capture="environment" hidden>
      ${scan.img ? `<img class="scanprev" alt="Dein Foto" src="${scan.img}">` : `<p class="note" style="margin:0">Fotografiere die Karte von vorn, gut beleuchtet, vor einem ruhigen Hintergrund und mit etwas Rand rundherum. Bei Glanzkarten die Karte leicht kippen, bis keine Spiegelung mehr auf Name und Nummer liegt. Wichtig ist, dass unten die Kartennummer (z. B. 154/128) lesbar ist. Die Erkennung läuft auf deinem Gerät.</p>`}
      ${scan.msg ? `<p class="note scanmsg">${esc(scan.msg)}</p>` : ""}
    </div>
    ${scan.fields ? scanFieldsHtml(scan.fields) : ""}
    ${scan.text ? `<details class="note" style="margin-top:10px"><summary>Erkannten Text anzeigen</summary><pre style="white-space:pre-wrap;font-size:12px">${esc(scan.text)}</pre></details>` : ""}
    ${scan.cands ? `<h2 class="section">${scan.cands.length === 1 ? "Erkannte Karte" : scan.cands.length ? `${scan.cands.length} mögliche Karten, tippe auf die richtige` : "Keine passende Karte gefunden"}</h2><div class="grid" id="s-grid"></div>` : ""}`;
  $("s-file").addEventListener("change", e => { const f = e.target.files?.[0]; e.target.value = ""; if (f) runScan(f); });
  if (scan.fields) $("s-search").onclick = () => {
    const number = $("s-num").value.trim().toUpperCase(), total = $("s-total").value.trim();
    scan.fields = { ...scan.fields, names: [], name: $("s-name").value.trim(), number, total, numbers: number ? [{ number, total, w: 1 }] : [], codes: [], code: $("s-code").value.trim().toUpperCase(), lang: $("s-lang").value };
    scan.cardFound = undefined;
    runIdentify();
  };
  if (scan.cands?.length) {
    const grid = $("s-grid");
    scan.cands.forEach(c => { const t = cardTile(c, null); t.onclick = () => openScanned(c, scan.fields); grid.appendChild(t);
      getCard(c.id, c.lang || state.lang).then(full => { if (full && document.contains(t)) { const n = cardTile(c, full); n.onclick = t.onclick; t.replaceWith(n); } }); });
  }
}
// Liest Name, Kartentext und Nummer aus dem Foto. Findet erst die Karte im Bild, sonst Rückfall auf Bildbereiche
async function readCard(w, base, say) {
  const angle = estimateSkew(base);
  const { W, H } = rotatedSize(base, angle);
  const card = findCard(base, angle);
  const texts = [], names = [], bots = []; let nums = [];
  const run = async (c, psm) => { const d = await ocr(w, c, psm); c.width = c.height = 0; texts.push(d.text); return d; };
  const strip = async (rect, scale, psm) => {
    let c = renderRegion(base, angle, rect, scale);
    const dark = meanLum(c) < 90;
    if (dark) c = renderRegion(base, angle, rect, scale, { invert: true });
    return { d: await run(c, psm), dark };
  };
  if (card) {
    const { x, y, w: cw, h: chh } = card;
    // ganze Karte (für Kartentext und Sprache)
    const sc = Math.min(3, 1200 / cw);
    const full = await run(renderRegion(base, angle, { x: x - cw * 0.03, y: y - chh * 0.03, w: cw * 1.06, h: chh * 1.06 }, sc), 3);
    const lines = ocrLines(full);
    say("Lese den Kartennamen…");
    const topRect = { x: x - cw * 0.03, y: y - chh * 0.06, w: cw * 1.06, h: chh * 0.26 }, tsc = Math.min(3.5, 1300 / cw);
    const top = await strip(topRect, tsc, 6);
    names.push(...nameFromLines(ocrLines(top.d)), ...nameFromLines(lines, (chh * 0.2 + chh * 0.03) * sc));
    if (!names.length) { // andere Helligkeit und geschärft nochmal versuchen
      const t2 = await run(binarize(renderRegion(base, angle, topRect, tsc, { invert: top.dark }), 2 * tsc), 11);
      names.push(...nameFromLines(ocrLines(t2)));
      if (!names.length) names.push(...nameFromLines(ocrLines(await run(binarize(renderRegion(base, angle, topRect, tsc, { invert: !top.dark }), 2 * tsc), 11))));
    }
    say("Lese Kartennummer und Set…");
    const botRect = { x: x - cw * 0.03, y: y + chh * 0.82, w: cw * 1.06, h: chh * 0.21 };
    const bs = Math.min(4, 2200 / cw);
    const bot = await strip(botRect, bs, 11);
    bots.push(bot.d.text);
    nums = numberCands(bot.d.text);
    const more = async (c, psm, wt) => { const d = await run(c, psm); bots.push(d.text); return numberCands(d.text, wt); };
    if (!nums.length) nums = await more(renderRegion(base, angle, botRect, bs, { invert: !bot.dark, contrast: 1.7 }), 6, 1);
    if (!nums.length) nums = await more(binarize(renderRegion(base, angle, botRect, bs, { invert: bot.dark, contrast: 1.2 }), 2 * bs), 6, 0.9);
    if (!nums.length) nums = await more(binarize(renderRegion(base, angle, botRect, bs, { invert: !bot.dark, contrast: 1.2 }), 2 * bs), 11, 0.9);
    nums.push(...numberCands(full.text, 0.7));
  }
  if (!card || !nums.length || !names.length) {
    // Rückfall: ganzes Bild, oberer und unterer Bereich
    const s1 = Math.min(1, 1800 / Math.max(W, H));
    const full = await run(renderRegion(base, angle, { x: 0, y: 0, w: W, h: H }, s1), 3);
    if (!names.length) {
      const top = await strip({ x: 0, y: 0, w: W, h: H * 0.4 }, Math.min(1.4, 2000 / W), 3);
      names.push(...nameFromLines(ocrLines(top.d)), ...nameFromLines(ocrLines(full), H * 0.4 * s1));
    }
    if (!nums.length) {
      const bot = await strip({ x: 0, y: H * 0.55, w: W, h: H * 0.45 }, Math.min(1.6, 2600 / W), 11); bots.push(bot.d.text);
      nums = [...numberCands(bot.d.text, 0.9), ...numberCands(full.text, 0.7)];
    }
  }
  return { texts, names, nums, card, angle, bots };
}
async function runScan(file) {
  if (scan.busy) return;
  scan.busy = true; scan.cands = null; scan.fields = null; scan.rawText = "";
  try { if (scan.img) URL.revokeObjectURL(scan.img); } catch {}
  scan.img = URL.createObjectURL(file);
  scan.msg = "Texterkennung wird geladen…"; renderScan();
  const say = (t) => { scan.msg = t; const el = document.querySelector(".scanmsg"); if (el) el.textContent = t; };
  try {
    cardIndex().catch(() => {}); // Kartenliste parallel laden
    const w = await getTess((st, p) => { if (/load|init/i.test(st)) say(`Texterkennung wird geladen… ${Math.round(p * 100)} %`); else if (/recogn/i.test(st)) say(`Lese die Karte… ${Math.round(p * 100)} %`); });
    say("Lese die Karte…");
    let base;
    try { base = await loadPhoto(file); } catch { scan.msg = "Das Foto konnte nicht geöffnet werden. Versuch es mit einem neuen Foto."; scan.fields = { name: "", number: "", total: "", code: "", lang: "" }; renderScan(); return; }
    let res = await readCard(w, base, say);
    if (!res.card && !res.names.length && !res.nums.length) res = await readCard(w, rotate90(base), say); // Karte quer fotografiert
    if (!res.names.length && !res.nums.length) res = await readCard(w, rotate90(rotate90(base)), say); // Karte steht auf dem Kopf
    base.width = base.height = 0;
    const { texts, names, nums } = res;
    scan.botText = res.bots.join("\n");
    scan.cardFound = !!res.card;
    const allText = texts.join("\n");
    scan.rawText = allText;
    const f = parseCardText(allText);
    if (nums.length) Object.assign(f, { number: nums[0].number, total: nums[0].total, code: nums.find(x => x.code)?.code || "", numLang: nums.find(x => x.lang)?.lang || "" });
    f.codes = [...new Set(nums.map(x => x.code).filter(Boolean))];
    f.numbers = nums.length ? nums.map(x => ({ number: x.number, total: x.total, w: x.w ?? 1 })) : (f.number ? [{ number: f.number, total: f.total, w: 1 }] : []);
    f.names = [...new Set(names)].slice(0, 6);
    f.name = f.names[0] || "";
    f.lang = detectLang(allText, f.numLang);
    scan.text = allText;
    scan.fields = f;
    await runIdentify(true);
  } catch (e) {
    console.error(e);
    scan.msg = !tessWorker ? "Die Texterkennung konnte nicht geladen werden. Prüfe deine Internetverbindung und versuche es noch einmal." : "Beim Auswerten des Fotos ist ein Fehler aufgetreten. Versuch es bitte noch einmal.";
    scan.fields = scan.fields || { name: "", number: "", total: "", code: "", lang: "" };
    renderScan();
  } finally { scan.busy = false; }
}
async function runIdentify(fromPhoto) {
  const f = scan.fields;
  if (!f.name && !f.number && !(f.names || []).length) { scan.cands = []; scan.msg = "Auf dem Foto war weder Name noch Kartennummer lesbar. Versuch ein schärferes Foto oder trag die Angaben unten selbst ein."; renderScan(); return; }
  scan.msg = "Suche die Karte in der Datenbank…"; renderScan();
  try {
    const list = await identifyCard(f);
    const want = ["de", "en"].includes(f.lang) ? f.lang : null;
    if (want) await Promise.all(list.slice(0, 12).map(async c => { if (c.lang !== want) { const v = await getCard(c.id, want); if (v) { c.lang = want; c.name = v.name; c.image = v.image || c.image; } } }));
    scan.cands = list;
    // automatisch öffnen nur bei klarem Vorsprung und einer unabhängigen Bestätigung (Name, Kartentext, Setkürzel oder Zeichner)
    const t = list[0], confirmed = t && (t.nsim >= 0.6 || (t.text || 0) >= 0.35 || t.codeOk || t.illus);
    const sure = !!t && (confirmed ? t.score >= 1.6 : (t.exact && t.score >= 1.9)) && (list.length === 1 || list[1].score < t.score - 0.35)
      && !(list.validNum && !t.num && !t.tot) // Nummer gelesen, passt aber nicht zur Karte
      && (scan.cardFound !== false || t.codeOk); // ohne erkannten Kartenrand könnten Name und Nummer von verschiedenen Karten stammen
    scan.msg = !list.length ? "Keine passende Karte gefunden. Prüf die erkannten Angaben unten und such erneut."
      : sure ? `Erkannt: ${list[0].name}${f.number ? " · Nr. " + f.number : ""}${f.lang ? " · " + LANGS[f.lang] : ""}.`
      : "Die Angaben passen auf mehrere Karten. Tippe unten auf die richtige.";
    if (sure) { scan.cands = [list[0]]; f.name = list[0].name; }
    renderScan();
    if (sure && fromPhoto && state.view === "scan") openScanned(list[0], f);
  } catch (e) {
    console.error(e);
    scan.msg = "Die Kartendatenbank ist gerade nicht erreichbar. Versuch es gleich noch einmal."; renderScan();
  }
}

/* ---------- Navigation ---------- */
function setLang(l) {
  state.lang = l; store.set("lang", l);
  $("lang-de").setAttribute("aria-pressed", l === "de");
  $("lang-en").setAttribute("aria-pressed", l === "en");
  $("q").placeholder = l === "de" ? "Kartenname, z. B. Glurak 30c" : "Card name, e.g. Charizard 30c";
  setsMerged = null; fillSetPicker(); // Setnamen in der gewählten Sprache
  if (state.view === "search" && (state.query || $("set-pick").value)) search(state.query);
}
async function setView(v) {
  state.view = v;
  ["search", "coll", "watch", "scan"].forEach(k => $("tab-" + k).setAttribute("aria-pressed", k === v));
  $("search-form").hidden = v !== "search";
  $("lang-row").hidden = v !== "search";
  $("set-pick").hidden = v !== "search";
  $("title").textContent = { search: "Kartenpreise", coll: "Meine Sammlung", watch: "Merkliste", scan: "Karte scannen" }[v];
  window.scrollTo(0, 0);
  if (v === "watch") { renderWatch(); if (watch.length && await refreshWatch() && state.view === "watch") renderWatch(); }
  else if (v === "coll") { renderColl(); if (coll.length && await refreshPrices() && state.view === "coll") renderColl(); }
  else if (v === "scan") renderScan();
  else search(state.query);
}

$("lang-en").onclick = () => setLang("en");
$("tab-search").onclick = () => setView("search");
$("tab-coll").onclick = () => setView("coll");
$("tab-watch").onclick = () => setView("watch");

setLang(state.lang);
$("q").value = state.lang === "en" ? "Charizard" : "Glurak";
state.query = $("q").value;
setView(coll.length ? "coll" : "search");
refreshWatch(); // Preise der Merkliste bei jedem Öffnen der App aufzeichnen
recordCollValue(); // Sammlungswert bei jedem Öffnen der App aufzeichnen

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
